name: Coletor de Trafego Aereo

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coletor
        run: python dashboard_dados.py

      - name: Commitar e enviar JSON gerado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza dados de tráfego aéreo"
          file_pattern: "voos_sul_*.json"
